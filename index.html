<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SandForge — Physics & Mob Sandbox</title>
  <!-- SANDFORGE_V3_REVAMP -->
  <meta name="sandforge-build" content="SANDFORGE_V3_REVAMP" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230d111a'/%3E%3Ccircle cx='12' cy='12' r='5' fill='%23fb923c'/%3E%3Ccircle cx='20' cy='20' r='5' fill='%2338bdf8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">SandForge</span>
        <span id="stats-pill" class="stats-pill">0 mobs</span>
      </div>
      <div class="top-actions">
        <button id="btn-pause" class="icon-btn" title="Pause / Play" aria-label="Pause or Play">⏸</button>
        <button id="btn-speed" class="pill-btn" title="Simulation Speed">1×</button>
        <button id="btn-zoom-reset" class="pill-btn hidden" title="Reset Zoom & Pan">1.0×</button>
        <button id="btn-scenes" class="pill-btn" title="Load Scene">Scenes</button>
        <button id="btn-clear" class="pill-btn danger" title="Clear World">Clear</button>
      </div>
    </header>

    <main class="stage" id="stage">
      <canvas id="view"></canvas>
      <div id="active-chip" class="active-chip" aria-live="polite">
        <span id="active-icon" class="active-icon">🖐️</span>
        <span id="active-name">Grab / Throw</span>
      </div>
      <div id="toast" class="toast hidden"></div>
    </main>

    <footer class="dock">
      <div class="dock-top">
        <div class="cat-tabs" id="cat-tabs" role="tablist">
          <button class="cat-tab active" data-cat="tools">Tools</button>
          <button class="cat-tab" data-cat="mobs">Mobs</button>
          <button class="cat-tab" data-cat="solids">Solids</button>
          <button class="cat-tab" data-cat="liquids">Liquids</button>
          <button class="cat-tab" data-cat="energy">Energy</button>
        </div>
        <div class="brush-wrap" id="brush-wrap">
          <span class="brush-label">Brush</span>
          <button class="size-btn" data-size="2">S</button>
          <button class="size-btn active" data-size="5">M</button>
          <button class="size-btn" data-size="10">L</button>
          <button class="size-btn" data-size="18">XL</button>
        </div>
      </div>

      <div class="palette-wrap" id="palette-wrap">
        <div class="palette-fade palette-fade-left" aria-hidden="true"></div>
        <div class="palette" id="palette"></div>
        <div class="palette-fade palette-fade-right" aria-hidden="true"></div>
      </div>
    </footer>
  </div>

  <div id="scenes-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head">
        <h2>Starter Worlds</h2>
        <button id="btn-close-scenes" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <div class="scene-list" id="scene-list"></div>
    </div>
  </div>

  <script src="engine.js"></script>
  <script src="main.js"></script>
</body>
</html>
